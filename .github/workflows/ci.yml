name: ci

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zhixu-store

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 子仓无 pnpm-lock.yaml（锁定在伞仓根），不能开 pnpm cache。
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm run typecheck
        timeout-minutes: 8

      - name: Test
        run: pnpm run test
        timeout-minutes: 10
        env:
          ZHIXU_REGISTRY_POSTGRES_TEST_URL: postgres://postgres:test@127.0.0.1:5432/postgres

      - name: Build
        run: pnpm run build
        timeout-minutes: 8
